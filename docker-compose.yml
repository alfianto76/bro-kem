services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5376
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CATALOG_API_URL: ${CATALOG_API_URL:-}
      CATALOG_API_TOKEN: ${CATALOG_API_TOKEN:-}
      SCRAPER_SOURCE_URL: ${SCRAPER_SOURCE_URL:-}
      SCRAPER_ITEM_SELECTOR: ${SCRAPER_ITEM_SELECTOR:-article}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-10000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    ports:
      - "5376:5376"
